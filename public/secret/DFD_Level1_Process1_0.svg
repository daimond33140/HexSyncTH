<svg width="960" height="480" viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Arrowhead Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Diagram Title -->
  <text x="480" y="55" text-anchor="middle" font-size="18" font-weight="700" fill="#000000" font-family="'Sarabun', 'Leelawadee UI', Tahoma, sans-serif">
    Dataflow Level 1 ของ Process 1.0 ระบบสมัครและจัดการข้อมูลสมาชิก
  </text>

  <!-- External Entity: สมาชิก -->
  <g id="entity-member">
    <rect x="100" y="220" width="140" height="70" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <text x="170" y="261" text-anchor="middle" font-size="15" font-weight="600" fill="#000000" font-family="'Sarabun', 'Leelawadee UI', Tahoma, sans-serif">สมาชิก</text>
  </g>

  <!-- Process 1.1: ตรวจสอบข้อมูลการสมัคร -->
  <g id="process-1-1">
    <rect x="400" y="130" width="170" height="74" rx="14" ry="14" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <line x1="400" y1="158" x2="570" y2="158" stroke="#000000" stroke-width="1.2" />
    <text x="485" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#000000" font-family="'Sarabun', 'Leelawadee UI', Tahoma, sans-serif">1.1</text>
    <text x="485" y="184" text-anchor="middle" font-size="13" font-weight="500" fill="#000000" font-family="'Sarabun', 'Leelawadee UI', Tahoma, sans-serif">ตรวจสอบข้อมูลการสมัคร</text>
  </g>

  <!-- Process 1.2: บันทึกข้อมูลสมาชิก -->
  <g id="process-1-2">
    <rect x="400" y="310" width="170" height="74" rx="14" ry="14" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <line x1="400" y1="338" x2="570" y2="338" stroke="#000000" stroke-width="1.2" />
    <text x="485" y="330" text-anchor="middle" font-size="13" font-weight="700" fill="#000000" font-family="'Sarabun', 'Leelawadee UI', Tahoma, sans-serif">1.2</text>
    <text x="485" y="364" text-anchor="middle" font-size="13" font-weight="500" fill="#000000" font-family="'Sarabun', 'Leelawadee UI', Tahoma, sans-serif">บันทึกข้อมูลสมาชิก</text>
  </g>

  <!-- Data Store: D1 ข้อมูลสมาชิก (Gane & Sarson: Right Open-ended Rectangle) -->
  <g id="data-store-d1">
    <!-- Left closed box for ID -->
    <rect x="710" y="322" width="45" height="50" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <text x="732.5" y="353" text-anchor="middle" font-size="14" font-weight="700" fill="#000000" font-family="'Sarabun', 'Leelawadee UI', Tahoma, sans-serif">D1</text>

    <!-- Right open box: top and bottom lines only -->
    <line x1="755" y1="322" x2="905" y2="322" stroke="#000000" stroke-width="1.5" />
    <line x1="755" y1="372" x2="905" y2="372" stroke="#000000" stroke-width="1.5" />
    <text x="830" y="353" text-anchor="middle" font-size="14" font-weight="600" fill="#000000" font-family="'Sarabun', 'Leelawadee UI', Tahoma, sans-serif">ข้อมูลสมาชิก</text>
  </g>

  <!-- Data Flow 1: สมาชิก -> 1.1 ตรวจสอบข้อมูลการสมัคร -->
  <path d="M 170 220 L 170 167 L 392 167" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="230" y="145" width="135" height="20" fill="#ffffff" />
  <text x="297" y="160" text-anchor="middle" font-size="12" font-weight="500" fill="#000000" font-family="'Sarabun', 'Leelawadee UI', Tahoma, sans-serif">ข้อมูลการสมัครสมาชิก</text>

  <!-- Data Flow 2: 1.1 -> 1.2 -->
  <path d="M 485 204 L 485 302" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="495" y="247" width="170" height="20" fill="#ffffff" />
  <text x="500" y="262" text-anchor="start" font-size="12" font-weight="500" fill="#000000" font-family="'Sarabun', 'Leelawadee UI', Tahoma, sans-serif">ข้อมูลสมาชิกที่ผ่านการตรวจสอบ</text>

  <!-- Data Flow 3: 1.2 -> D1 ข้อมูลสมาชิก -->
  <path d="M 570 347 L 702 347" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="615" y="325" width="50" height="18" fill="#ffffff" />
  <text x="640" y="339" text-anchor="middle" font-size="12" font-weight="500" fill="#000000" font-family="'Sarabun', 'Leelawadee UI', Tahoma, sans-serif">บันทึก</text>

  <!-- Data Flow 4: 1.2 -> สมาชิก (ผลการสมัครสมาชิก) -->
  <path d="M 400 355 L 170 355 L 170 298" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="75" y="325" width="90" height="18" fill="#ffffff" />
  <text x="120" y="339" text-anchor="middle" font-size="12" font-weight="500" fill="#000000" font-family="'Sarabun', 'Leelawadee UI', Tahoma, sans-serif">ผลการสมัครสมาชิก</text>
</svg>
